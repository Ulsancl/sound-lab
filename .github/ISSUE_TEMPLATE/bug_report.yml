name: 오류 신고
description: 재현 가능한 정상파 실험·화면·파일·오디오 문제를 알려 주세요.
title: "[오류] "
body:
  - type: markdown
    attributes:
      value: |
        실험 원문을 먼저 보관하세요. 개인 경로, 계정 정보, 토큰, 기기 식별자나 전체 사용자 프로필을 올리지 마세요.
        Sound Lab은 이상적인 1차원 관의 정상파를 다룹니다. 실제 음압·음향 안전·악기 성능을 검증하지 않습니다.
  - type: input
    id: version
    attributes:
      label: Sound Lab 버전
      description: 프로그램 정보 또는 설치 파일 이름의 버전입니다.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: Windows 버전, GPU, 화면 배율·해상도, 설치 앱 또는 개발 브라우저 여부를 적어 주세요. 오디오 문제라면 출력 장치 종류도 알려 주세요. 개인 경로는 필요 없습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 관 조건과 재현 순서
      description: 길이·열림/막힘·모드·위상·탐침 위치와 누른 버튼 순서를 적어 주세요. 위상 재생과 음높이 듣기 중 무엇을 사용했는지, 현재 또는 보관한 비교인지도 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 기대한 결과와 실제 결과
      description: 오류 문구, Hz·파장·상대값, 그래프·3D 중 어긋난 부분을 포함하면 도움이 됩니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 선택 자료
      description: 개인 정보를 지운 작은 실험 JSON이나 스크린샷을 첨부할 수 있습니다. 비교 이름을 확인하고 손상 원본을 덮어쓰지 마세요.
